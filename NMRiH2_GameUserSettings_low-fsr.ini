; ============================================================
; SEÇÃO: INTERNATIONALIZATION (Idioma)
; ============================================================
[Internationalization]
Language=en                         ; Idioma do jogo - RECRIADO PELO JOGO (valor padrão: en)
Locale=en                           ; Localização - RECRIADO PELO JOGO (valor padrão: en)

; ============================================================
; SEÇÃO: SCALABILITY GROUPS (Presets Gráficos)
; ============================================================
[ScalabilityGroups]
; O jogo RECRIA essas linhas SEMPRE que você abre o menu gráfico.
; Valores: 0 = Baixo, 1 = Médio, 2 = Alto, 3 = Épico (para a maioria)
; Para "AnimationQuality", 0 = Baixo, 4 = Máximo (único que vai até 4)

sg.ResolutionQuality=66.6667023     ; Qualidade de resolução (upscaling) - RECRIADO PELO JOGO
                                    ; LOW: 66.6 (FSR Balanceado) | HIGH: 100 (Nativo/DLSS Qualidade)
                                    ; Esse valor é alterado automaticamente pelo FSR/DLSS.

sg.ViewDistanceQuality=0            ; Distância de visão - RECRIADO PELO JOGO
                                    ; LOW: 0 (mínimo - melhor FPS) | HIGH: 3 (máximo)

sg.AntiAliasingQuality=0            ; Qualidade do Anti-Aliasing - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - mais nítido) | HIGH: 3 (épico - TAA, borra)

sg.ShadowQuality=0                  ; Qualidade das sombras - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - clareia tudo) | HIGH: 3 (máximo)

sg.GlobalIlluminationQuality=0      ; Iluminação global - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - FPS) | HIGH: 3 (épico - bonito)

sg.ReflectionQuality=0              ; Qualidade dos reflexos - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado) | HIGH: 3 (épico)

sg.PostProcessQuality=0             ; Qualidade do pós-processamento - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - sem bloom/blur) | HIGH: 3 (épico)

sg.TextureQuality=0                 ; Qualidade das texturas - RECRIADO PELO JOGO
                                    ; LOW: 0 (baixa - economiza VRAM) | HIGH: 3 (épico)

sg.EffectsQuality=0                 ; Qualidade dos efeitos (partículas) - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado) | HIGH: 3 (épico)

sg.FoliageQuality=0                 ; Qualidade da vegetação - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - remove arbustos) | HIGH: 3 (épico)

sg.ShadingQuality=0                 ; Qualidade do sombreamento - RECRIADO PELO JOGO
                                    ; LOW: 0 (mínimo) | HIGH: 3 (máximo)

sg.LandscapeQuality=0               ; Qualidade do terreno - RECRIADO PELO JOGO
                                    ; LOW: 0 (mínimo) | HIGH: 3 (máximo)

sg.AnimationQuality=4               ; Qualidade das animações - RECRIADO PELO JOGO
                                    ; LOW: 0 (mínimo - animações travadas) | HIGH: 4 (máximo - fluidas)

; ============================================================
; SEÇÃO: KOSOVO (Configurações do NMRiH 2 - A SEÇÃO MAIS IMPORTANTE)
; ============================================================
; ATENÇÃO: O jogo LÊ essa seção primeiro. Ela Sobrescreve a seção
; O jogo RECRIA todas as linhas abaixo se você deletar o arquivo.
; VALORES PADRÃO EM MAIUSCULO.
; ============================================================
[/Script/Kosovo.KGameUserSettings]

; ----- BENCHMARK E VERSÃO -----
bRanBenchmark=False                  ; Já executou benchmark? - RECRIADO PELO JOGO
                                    ; MANTENHA EM FALSE / KEEP ON FALSE
                                    ; LOW: True | HIGH: True (valor padrão: False)

SettingsVersion=5                   ; Versão do arquivo - RECRIADO PELO JOGO
                                    ; LOW: 5 | HIGH: 5 (não mexer)

; ----- GAMA E FOV (VISIBILIDADE) -----
bHasGammaCorrection=True            ; Correção de Gama ativada? - RECRIADO PELO JOGO
                                    ; LOW: True (deixe True para o Gama funcionar) | HIGH: True

Gamma=4.000000                      ; Brilho/Gama da imagem - RECRIADO PELO JOGO
                                    ; LOW: 4.0 (MÁXIMO - clareia tudo) | HIGH: 2.5 (padrão)
                                    ; Se colocar > 2.7, o jogo pode resetar para 2.7, mas com
                                    ; o Engine.ini travado, isso não importa.

FieldOfView=90.000000              ; Campo de visão (FOV) - RECRIADO PELO JOGO
                                    ; LOW: 110 (MÁXIMO - enxerga mais área) | HIGH: 90 (padrão)

; ----- QUALIDADE GRÁFICA (KOSOVO) -----
VolumetricsQuality=0                ; Qualidade da neblina volumétrica - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - FPS) | HIGH: 3 (máximo)

GoreQuality=0                       ; Qualidade do gore/sangue - RECRIADO PELO JOGO
                                    ; LOW: 0 (desligado - limpa visão) | HIGH: 3 (máximo)

PhysicsQuality=0                    ; Qualidade da física - RECRIADO PELO JOGO
                                    ; LOW: 0 (mínimo - FPS) | HIGH: 3 (máximo)

AnimationQuality=4                  ; Qualidade das animações - RECRIADO PELO JOGO
                                    ; LOW: 4 (máximo - animações fluidas) | HIGH: 4 (máximo)
                                    ; Diferente da seção Scalability, aqui 4 é MÁXIMO.

; ----- EFEITOS VISUAIS (LIGA/DESLIGA) -----
SSAOEnabled=False                   ; Sombras de ambiente (oclusão) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado - clareia) | HIGH: True (ligado - bonito)

BloomEnabled=False                  ; Efeito Bloom (brilho) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado - não ofusca) | HIGH: True (ligado)

LensFlareEnabled=False              ; Reflexos de lente - RECRIADO PELO JOGO
                                    ; LOW: False (desligado) | HIGH: True (ligado)

MotionBlurEnabled=False             ; Borrão de movimento - RECRIADO PELO JOGO
                                    ; LOW: False (desligado) | HIGH: False (desligado - sempre melhor)

DepthOfFieldEnabled=False           ; Profundidade de campo (desfoque) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado) | HIGH: False (desligado - sempre melhor)

ChromaticAberrationEnabled=False    ; Aberração cromática (bordas coloridas) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado - remove poluição) | HIGH: True (ligado)

LowLatencyModeEnabled=False         ; Modo de baixa latência (Reflex/Boost) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado) | HIGH: False (desligado - pode dar stutter)

VignetteEnabled=False               ; Vinheta escura nas bordas - RECRIADO PELO JOGO
                                    ; LOW: False (desligado - clareia a tela toda) | HIGH: False (desligado)

; ----- LIMITE DE FPS NO MENU -----
MaxFpsInMenus=45                    ; Limite de FPS nos menus - RECRIADO PELO JOGO
                                    ; LOW: 45 (economiza GPU) | HIGH: 45 (padrão)

; ----- FLAGS (NÃO MEXER) -----
BootflowFlags=(Flags=(((TagName="Bootflow.Flag.GammaSetting"), 0),((TagName="Bootflow.Flag.AccessibilitySettings"), 0)))
                                    ; Flags de inicialização - RECRIADO PELO JOGO
                                    ; evita a tela de ajuste de gamma e acessibilidade
                                    ; Não mexer. Valor padrão: vazio.

MainMenuFlags=(Flags=(((TagName="UI.MainMenu.KnownRewardsChecked"), 1)))
                                    ; Flags do menu principal - RECRIADO PELO JOGO
                                    ; SUPOSTAMENTE evita alguma tela de recompensa
                                    ; Não mexer. Valor padrão: (Flags=())

; ----- TELA E RESOLUÇÃO -----
bUseVSync=False                     ; Sincronização vertical (VSync) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado - menos input lag) | HIGH: False (desligado)

bUseDynamicResolution=False         ; Resolução dinâmica (muda resolução pra manter FPS) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado - imagem não fica oscilando) | HIGH: False

ResolutionSizeX=1920                ; Largura da resolução - RECRIADO PELO JOGO
                                    ; LOW: 1920 | HIGH: 1920

ResolutionSizeY=1080                ; Altura da resolução - RECRIADO PELO JOGO
                                    ; LOW: 1080 | HIGH: 1080

LastUserConfirmedResolutionSizeX=1920 ; Última resolução confirmada - RECRIADO PELO JOGO
                                    ; LOW: 1920 | HIGH: 1920

LastUserConfirmedResolutionSizeY=1080 ; Última resolução confirmada - RECRIADO PELO JOGO
                                    ; LOW: 1080 | HIGH: 1080

FullscreenMode=1                    ; Modo de tela cheia - RECRIADO PELO JOGO
                                    ; LOW: 1 (exclusiva - melhor performance) | HIGH: 1 (exclusiva)
                                    ; 0 = Janela | 1 = Tela Cheia Exclusiva | 2 = Tela Cheia Sem Bordas

LastConfirmedFullscreenMode=1       ; Último modo de tela cheia confirmado - RECRIADO PELO JOGO
                                    ; LOW: 1 | HIGH: 1

PreferredFullscreenMode=1           ; Modo de tela cheia preferido - RECRIADO PELO JOGO
                                    ; LOW: 1 | HIGH: 1

Version=5                           ; Versão do arquivo - RECRIADO PELO JOGO
                                    ; LOW: 5 | HIGH: 5 (não mexer)

; ----- ÁUDIO -----
AudioQualityLevel=0                 ; Qualidade do áudio - RECRIADO PELO JOGO
                                    ; LOW: 0 (baixa - economiza CPU) | HIGH: 3 (máxima)
                                    ; Áudio não impacta GPU, mas afeta CPU. Deixe 3 se tiver CPU boa.

LastConfirmedAudioQualityLevel=0    ; Última qualidade de áudio confirmada - RECRIADO PELO JOGO
                                    ; LOW: 0 | HIGH: 3

; ----- LIMITE DE FPS -----
FrameRateLimit=144.000000           ; Limite de FPS - RECRIADO PELO JOGO
                                    ; LOW: 144 (máximo) | HIGH: 144 (máximo)
                                    ; Se quiser economizar energia, mude para 75 ou 60.

; ----- RESOLUÇÃO DESEJADA (PARA UPSACALING) -----
DesiredScreenWidth=1280             ; Largura desejada para upscaling - RECRIADO PELO JOGO
                                    ; LOW: 1280 (FSR Balanceado usa resolução menor) | HIGH: 1920 (nativo)

DesiredScreenHeight=720             ; Altura desejada para upscaling - RECRIADO PELO JOGO
                                    ; LOW: 720 (FSR Balanceado) | HIGH: 1080 (nativo)

LastUserConfirmedDesiredScreenWidth=1280 ; Última largura desejada confirmada - RECRIADO PELO JOGO
                                    ; LOW: 1280 | HIGH: 1920

LastUserConfirmedDesiredScreenHeight=720 ; Última altura desejada confirmada - RECRIADO PELO JOGO
                                    ; LOW: 720 | HIGH: 1080

LastRecommendedScreenWidth=-1.000000 ; Última resolução recomendada - RECRIADO PELO JOGO
                                    ; LOW: -1 | HIGH: -1 (não mexer)

LastRecommendedScreenHeight=-1.000000 ; Última resolução recomendada - RECRIADO PELO JOGO
                                    ; LOW: -1 | HIGH: -1 (não mexer)

LastCPUBenchmarkResult=-1.000000    ; Resultado do benchmark da CPU - RECRIADO PELO JOGO
                                    ; LOW: -1 | HIGH: -1 (não mexer)

LastGPUBenchmarkResult=-1.000000    ; Resultado do benchmark da GPU - RECRIADO PELO JOGO
                                    ; LOW: -1 | HIGH: -1 (não mexer)

LastGPUBenchmarkMultiplier=1.000000 ; Multiplicador do benchmark - RECRIADO PELO JOGO
                                    ; LOW: 1.0 | HIGH: 1.0 (não mexer)

bUseHDRDisplayOutput=False          ; HDR (High Dynamic Range) - RECRIADO PELO JOGO
                                    ; LOW: False (desligado) | HIGH: False (desligado)

HDRDisplayOutputNits=1000           ; Brilho do HDR (se ativado) - RECRIADO PELO JOGO
                                    ; LOW: 1000 | HIGH: 1000 (não mexer)

