; Esse arquivo contém as configurações do usuário.
; O jogo RECRIA muitas linhas se você deletar o arquivo.
; Linhas marcadas com "RECRIADO PELO JOGO" são adicionadas
; automaticamente quando o jogo inicia com um .ini vazio.
; Linhas marcadas com "CUSTOM" são linhas que você adiciona
; manualmente e o jogo NÃO as recria (mas também não as apaga).
; ============================================================
;
; DEPOIS DE ALTERAR DEIXE A PASTA SOMENTE LEITURA
; AFTER MAKING CHANGES, SET THE FOLDER TO READ-ONLY
;
; GameUserSettings.ini
; Windows
; %LOCALAPPDATA%\NMRIH2\Saved\Config\Windows
;
; Linux
; ~/.steam/steam/steamapps/compatdata/292000/pfx/drive_c/users/steamuser/AppData/Local/NMRiH2/Saved/Config/WindowsClient/
; $SteamLibrary$/steamapps/compatdata/292000/pfx/drive_c/users/steamuser/AppData/Local/NMRiH2/Saved/Config/WindowsClient/
;
; INSTRUCTIONS
; First, make a copy of your "GameUserSettings.ini" file—rename it to something like "GameUserSettings_original.ini" or create a zip file to keep it safe.
; Replace the original with this one and enjoy.
;
; Adding a semicolon (;) in front of a line of code will disable it, removing the semicolon (;) will enable it.
;
