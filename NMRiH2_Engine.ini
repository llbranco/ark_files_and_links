; ============================================================
; SEÇÃO: RENDERER SETTINGS (Configurações do Renderizador)
; ============================================================
[/Script/Engine.RendererSettings]

; ===== NEBLINA E NÉVOA =====
r.VolumetricFog=0                   ; Desliga neblina volumétrica (aquela que esconde o chão)
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado - recomendado para performance)
                                    ; VALOR PADRÃO: 1 (ligado) - O jogo NÃO recria essa linha.

r.Fog=0                             ; Desliga neblina normal (deixa o ar mais limpo)
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado - recomendado para performance)
                                    ; VALOR PADRÃO: 1 (ligado) - O jogo NÃO recria essa linha.

; ============================================================
; SEÇÃO: ENGINE (Configurações Gerais do Motor)
; ============================================================
[/Script/Engine.Engine]

; ===== VEGETAÇÃO =====
foliage.DensityScale=0              ; Remove arbustos/folhagens (melhora FPS e visibilidade)
                                    ; LOW: 0 (desligado) | HIGH: 1.0 (padrão - vegetação cheia)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

grass.DensityScale=0                ; Remove grama (clareia o chão e melhora FPS)
                                    ; LOW: 0 (desligado) | HIGH: 1.0 (padrão - grama cheia)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

; ============================================================
; SEÇÃO: SYSTEM SETTINGS (Configurações Avançadas do Sistema)
; ============================================================
[SystemSettings]

; ============================================================
; 1. NITIDEZ DA IMAGEM (Anti-Borrão)
; ============================================================

r.MipMapLODBias=-1                  ; Controla a nitidez das texturas. Valores negativos = mais nítidas.
                                    ; LOW: -1 (super nítido) | HIGH: 0 (padrão - borra um pouco de longe)
                                    ; VALOR PADRÃO: 0 - O jogo NÃO recria essa linha.

r.SkeletalMeshLODBias=0             ; Controla a qualidade dos personagens à distância.
                                    ; LOW: 0 (máxima qualidade) | HIGH: 0 (máxima qualidade)
                                    ; VALOR PADRÃO: 0 - O jogo NÃO recria essa linha.

r.StaticMeshLODDistanceScale=1.0    ; Distância para trocar LOD de objetos estáticos.
                                    ; LOW: 1.0 (máxima qualidade) | HIGH: 1.0 (padrão)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

r.ViewDistanceScale=1.0             ; Distância máxima de visão (ver objetos de longe).
                                    ; LOW: 1.0 (máxima distância) | HIGH: 1.0 (padrão)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

r.Tonemapper.Sharpen=3.5            ; Nitidez da imagem final. Quanto maior, mais nítido.
                                    ; LOW: 3.5 (super nítido - para baixa visão) | HIGH: 1.0 (padrão - suave)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

r.MaxAnisotropy=16                  ; Nitidez de texturas vistas de lado (paredes, chão).
                                    ; LOW: 16 (máximo - nítido de lado) | HIGH: 16 (máximo)
                                    ; VALOR PADRÃO: 4 (ou 8) - O jogo NÃO recria essa linha.

r.Tonemapper.GrainQuantization=0    ; Remove o "grão de filme" (ruído visual).
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado)
                                    ; VALOR PADRÃO: 1 (ligado) - O jogo NÃO recria essa linha.

r.SceneColorFringeQuality=0         ; Remove aberração cromática (bordas coloridas - poluição visual).
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado)
                                    ; VALOR PADRÃO: 1 (ligado) - O jogo NÃO recria essa linha.

; ============================================================
; 2. ANTI-ALIASING (Anti-Serrilhado)
; ============================================================

r.DefaultFeature.AntiAliasing=0     ; Controla o tipo de Anti-Aliasing.
                                    ; 0 = Desligado (imagem mais nítida, mas com serrilhados)
                                    ; 2 = TAA (borra a imagem em movimento - PÉSSIMO para baixa visão)
                                    ; LOW: 0 (desligado - mais nítido) | HIGH: 2 (TAA - mais suave)
                                    ; VALOR PADRÃO: 2 - O jogo NÃO recria essa linha.

r.PostProcessAAQuality=0            ; Qualidade do Anti-Aliasing pós-processamento.
                                    ; 0 = Desligado | 4 = Épico
                                    ; LOW: 0 (desligado) | HIGH: 4 (épico - se usar TAA)
                                    ; VALOR PADRÃO: 4 - O jogo NÃO recria essa linha.

r.MSAA.CompositingSampleCount=0     ; MSAA (mais pesado) - Forçado desligado para performance.
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado)
                                    ; VALOR PADRÃO: 4 - O jogo NÃO recria essa linha.

; ============================================================
; 3. LUZ E SOMBRAS (Clarear o jogo)
; ============================================================

r.DefaultFeature.Bloom=False        ; Desliga brilhos excessivos (que ofuscam a visão).
                                    ; LOW: False (desligado) | HIGH: True (ligado - gráficos bonitos)
                                    ; VALOR PADRÃO: True - O jogo NÃO recria essa linha.

r.BloomQuality=0                    ; Qualidade do Bloom (forçado desligado).
                                    ; LOW: 0 (desligado) | HIGH: 5 (máximo)
                                    ; VALOR PADRÃO: 5 - O jogo NÃO recria essa linha.

r.DefaultFeature.AmbientOcclusion=False ; Desliga sombras de ambiente (clareia cantos escuros).
                                    ; LOW: False (desligado) | HIGH: True (ligado - sombras suaves)
                                    ; VALOR PADRÃO: True - O jogo NÃO recria essa linha.

r.DefaultFeature.AmbientOcclusionStaticFraction=False ; Desliga AO em objetos estáticos.
                                    ; LOW: False (desligado) | HIGH: True (ligado)
                                    ; VALOR PADRÃO: True - O jogo NÃO recria essa linha.

r.DefaultFeature.MotionBlur=False   ; Desliga borrão de movimento.
                                    ; LOW: False (desligado) | HIGH: False (desligado - sempre melhor desligar)
                                    ; VALOR PADRÃO: True - O jogo NÃO recria essa linha.

r.DefaultFeature.LensFlare=False    ; Desliga reflexos de lente.
                                    ; LOW: False (desligado) | HIGH: True (ligado - reflexos bonitos)
                                    ; VALOR PADRÃO: True - O jogo NÃO recria essa linha.

r.DepthOfFieldQuality=0             ; Desliga profundidade de campo (desfoque de fundo).
                                    ; LOW: 0 (desligado) | HIGH: 3 (ligado - desfoque)
                                    ; VALOR PADRÃO: 3 - O jogo NÃO recria essa linha.

r.ShadowQuality=0                   ; Desliga sombras completamente.
                                    ; LOW: 0 (desligado - clareia tudo) | HIGH: 5 (máximo - gráficos bonitos)
                                    ; VALOR PADRÃO: 5 - O jogo NÃO recria essa linha.

r.Shadow.CSM.MaxCascades=0          ; Desliga cascatas de sombras (economiza GPU).
                                    ; LOW: 0 (desligado) | HIGH: 4 (máximo)
                                    ; VALOR PADRÃO: 4 - O jogo NÃO recria essa linha.

r.Shadow.MaxResolution=2            ; Resolução das sombras (mínimo = 2, máximo = 2048).
                                    ; LOW: 2 (praticamente desligado) | HIGH: 2048 (máximo)
                                    ; VALOR PADRÃO: 2048 - O jogo NÃO recria essa linha.

r.Shadow.DistanceScale=0.0          ; Distância de renderização das sombras.
                                    ; LOW: 0.0 (desligado) | HIGH: 1.0 (padrão)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

r.AllowLandscapeShadows=0           ; Desliga sombras no chão/terreno.
                                    ; LOW: 0 (desligado) | HIGH: 1 (ligado)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

r.AmbientOcclusionMaxQuality=0      ; Qualidade máxima da AO (forçado desligado).
                                    ; LOW: 0 (desligado) | HIGH: 3 (máximo)
                                    ; VALOR PADRÃO: 3 - O jogo NÃO recria essa linha.

r.LightShaftQuality=0               ; Desliga raios de luz volumétricos.
                                    ; LOW: 0 (desligado) | HIGH: 3 (máximo)
                                    ; VALOR PADRÃO: 3 - O jogo NÃO recria essa linha.

r.DistanceFieldShadowing=0          ; Desliga sombras por campo de distância.
                                    ; LOW: 0 (desligado) | HIGH: 1 (ligado)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

r.DistanceFieldAO=0                 ; Desliga AO por campo de distância.
                                    ; LOW: 0 (desligado) | HIGH: 1 (ligado)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

; ============================================================
; 4. PARTÍCULAS E TRANSPARÊNCIA (Limpar poluição visual)
; ============================================================

r.EmitterSpawnRateScale=0           ; Remove partículas (fumaça, faíscas, etc).
                                    ; LOW: 0 (desligado) | HIGH: 1.0 (padrão)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

r.ParticleLightQuality=0            ; Desliga luzes de partículas.
                                    ; LOW: 0 (desligado) | HIGH: 2 (máximo)
                                    ; VALOR PADRÃO: 2 - O jogo NÃO recria essa linha.

r.SeparateTranslucency=False        ; Desativa translucidez separada (economiza GPU).
                                    ; LOW: False (desligado) | HIGH: True (ligado)
                                    ; VALOR PADRÃO: True - O jogo NÃO recria essa linha.

r.SSS.Scale=0                       ; Desliga pele translúcida (subsurface scattering).
                                    ; LOW: 0 (desligado) | HIGH: 1.0 (ligado)
                                    ; VALOR PADRÃO: 1.0 - O jogo NÃO recria essa linha.

r.SSS.SampleSet=0                   ; Desliga amostras de pele translúcida.
                                    ; LOW: 0 (desligado) | HIGH: 1 (ligado)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

r.SSS.Quality=0                     ; Desliga qualidade da pele translúcida.
                                    ; LOW: 0 (desligado) | HIGH: 1 (ligado)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

r.TranslucencyLightingVolumeDim=1   ; Volume de iluminação translúcida (mínimo = 1, máximo = 64).
                                    ; LOW: 1 (mínimo - economiza GPU) | HIGH: 64 (máximo - qualidade)
                                    ; VALOR PADRÃO: 64 - O jogo NÃO recria essa linha.

; ============================================================
; 5. UPSCALING (DLSS/FSR/XeSS) - FORÇADOS DESLIGADOS
; ============================================================

r.Upscale.Quality=0                 ; Desliga qualquer upscaling nativo.
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado - forçado pela Engine.ini)
                                    ; VALOR PADRÃO: 1 (ligado) - O jogo NÃO recria essa linha.



r.FSR.Enabled=0                     ; Desliga FSR (AMD).
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado - controlado pelo GameUserSettings)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.
r.FSR.Quality=0                     ; 2 = balanceado

r.FSR3.Enabled=0                    ; Desliga FSR3 (AMD).
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado - controlado pelo GameUserSettings)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

r.Ngx.Enable=0                      ; Desliga DLSS (Nvidia).
                                    ; LOW: 0 (desligado) | HIGH: 0 (desligado - controlado pelo GameUserSettings)
                                    ; VALOR PADRÃO: 1 - O jogo NÃO recria essa linha.

r.Ngx.DLSS.Quality=0                ; 2 = qualidade

; ============================================================
; 6. PERFORMANCE (VRAM)
; ============================================================

r.RenderTargetPoolMin=256           ; Pool mínimo de renderização (estabiliza FPS).
                                    ; LOW: 256 (mínimo) | HIGH: 256 (padrão - não mexer)
                                    ; VALOR PADRÃO: 400 - O jogo NÃO recria essa linha.

r.SceneColorFormat=3                ; Formato de cor (economiza VRAM sem perder qualidade).
                                    ; LOW: 3 (economia) | HIGH: 3 (padrão)
                                    ; VALOR PADRÃO: 4 - O jogo NÃO recria essa linha.

r.Streaming.PoolSize=7680           ; Pool de texturas para VRAM (em MB).
                                    ; LOW: 4096 (para 6GB) | HIGH: 7680 (para 8GB)
                                    ; VALOR PADRÃO: 0 (auto) - O jogo NÃO recria essa linha.
                                    ; Se tiver 6GB, mude para 4096. Se tiver 8GB+, mantenha 7680.
